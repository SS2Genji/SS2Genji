<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="100%" height="290">
  <defs>
    <!-- Typewriter Clip Path -->
    <clipPath id="type-clip">
      <rect x="235" y="45" width="0" height="25">
        <animate attributeName="width" 
                 values="0;10;21;32;43;54;65;76;87" 
                 keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1"
                 dur="1.2s" 
                 begin="0.6s; terminalLoop.begin+0.6s"
                 fill="freeze" 
                 calcMode="discrete" />
      </rect>
    </clipPath>

    <!-- Cursor Movement Animation -->
    <style>
      .bg { fill: #090d13; stroke: #2d333b; stroke-width: 1px; rx: 8px; }
      .topbar { fill: #161b22; stroke: #2d333b; stroke-width: 1px; }
      .title { fill: #768390; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; text-anchor: middle; }
      .mono { font-family: "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 13px; }
      
      .prompt-user { fill: #38bdf8; font-weight: 700; }
      .prompt-path { fill: #c084fc; font-weight: 600; }
      .cmd-text { fill: #f8fafc; font-weight: 600; }
      
      .arch-logo { fill: #1793d1; font-weight: bold; }
      .label { fill: #f59e0b; font-weight: 600; }
      .val { fill: #e2e8f0; }
      .status-val { fill: #fbbf24; font-weight: 600; }

      /* Fade in animations for output lines */
      .fade-out {
        opacity: 0;
        animation: showOutput 10s infinite;
      }
      @keyframes showOutput {
        0%, 19% { opacity: 0; }
        22%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      /* Animated Typewriter Cursor */
      .type-cursor {
        fill: #38bdf8;
        animation: cursorBlink 0.8s infinite;
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* End Prompt Cursor */
      .end-cursor {
        fill: #38bdf8;
        opacity: 0;
        animation: showEndCursor 10s infinite;
      }
      @keyframes showEndCursor {
        0%, 25% { opacity: 0; }
        26%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Hidden Timer Loop (10 seconds cycle) -->
  <rect id="terminalLoop" width="0" height="0">
    <animate attributeName="width" from="0" to="1" dur="10s" repeatCount="indefinite" />
  </rect>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="778" height="288" rx="8" class="bg" />

  <!-- Top Header Bar -->
  <path d="M 1 9 Q 1 1 9 1 L 771 1 Q 779 1 779 9 L 779 32 L 1 32 Z" class="topbar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="16" r="5.5" fill="#ff5f56" />
  <circle cx="36" cy="16" r="5.5" fill="#ffbd2e" />
  <circle cx="52" cy="16" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="390" y="20" class="title">genji@archlinux: ~</text>

  <!-- ================= FIRST PROMPT & COMMAND ================= -->
  <g class="mono">
    <text x="24" y="62" class="prompt-user">genji@archlinux</text>
    <text x="150" y="62" fill="#768390">:</text>
    <text x="160" y="62" class="prompt-path">~</text>
    <text x="175" y="62" fill="#768390">$</text>
    
    <!-- Command typed out with clip-path -->
    <text x="195" y="62" class="cmd-text" clip-path="url(#type-clip)">fastfetch</text>
    
    <!-- Animated Cursor following command -->
    <rect y="48" width="8" height="16" class="type-cursor">
      <animate attributeName="x" 
               values="195;205;216;227;238;249;260;271;282" 
               keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1"
               dur="1.2s" 
               begin="0.6s; terminalLoop.begin+0.6s"
               fill="freeze" 
               calcMode="discrete" />
      <animate attributeName="opacity"
               values="1;1;0;0"
               keyTimes="0;0.18;0.22;1"
               dur="10s"
               repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ================= FASTFETCH OUTPUT (Appears at t=2.2s) ================= -->
  <g class="mono fade-out">
    <!-- Arch Linux ASCII Art (Left Column) -->
    <g class="arch-logo">
      <text x="40" y="100">        /\</text>
      <text x="40" y="120">       /  \</text>
      <text x="40" y="140">      /\   \</text>
      <text x="40" y="160">     /      \</text>
      <text x="40" y="180">    /   ,,   \</text>
      <text x="40" y="200">   /   |  |  -\</text>
      <text x="40" y="220">  /_-''    ''-_\</text>
    </g>

    <!-- User Profile Specs (Right Column) -->
    <g transform="translate(230, 0)">
      <!-- User -->
      <text x="0" y="100" class="label">User:</text>
      <text x="95" y="100" class="val" font-weight="600">Ahmet Emir Şimşek</text>

      <!-- Academy -->
      <text x="0" y="124" class="label">Academy:</text>
      <text x="95" y="124" class="val">42 Istanbul</text>

      <!-- OS -->
      <text x="0" y="148" class="label">OS:</text>
      <text x="95" y="148" class="val">Arch Linux x86_64</text>

      <!-- Focus -->
      <text x="0" y="172" class="label">Focus:</text>
      <text x="95" y="172" class="val">C, Algorithms, Python</text>

      <!-- Editor -->
      <text x="0" y="196" class="label">Editor:</text>
      <text x="95" y="196" class="val">Neovim, VSCode</text>

      <!-- Status -->
      <text x="0" y="220" class="label">Status:</text>
      <text x="95" y="220" class="status-val">Rested at Site of Grace</text>
    </g>
  </g>

  <!-- ================= NEXT PROMPT & BLINKING CURSOR ================= -->
  <g class="mono end-cursor">
    <text x="24" y="260" class="prompt-user">genji@archlinux</text>
    <text x="150" y="260" fill="#768390">:</text>
    <text x="160" y="260" class="prompt-path">~</text>
    <text x="175" y="260" fill="#768390">$</text>
    <rect x="195" y="246" width="8" height="16" fill="#38bdf8" class="type-cursor" />
  </g>
</svg>
