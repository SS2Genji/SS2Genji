<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="100%" height="270">
  <defs>
    <style>
      .bg { fill: #090d13; stroke: #2d333b; stroke-width: 1px; rx: 8px; }
      .topbar { fill: #161b22; stroke: #2d333b; stroke-width: 1px; }
      .title { fill: #768390; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; text-anchor: middle; }
      .text { font-family: "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.5; }
      .prompt { fill: #38bdf8; font-weight: bold; }
      .host { fill: #c084fc; }
      .cmd { fill: #ffffff; }
      .output-dim { fill: #8b949e; }
      .success { fill: #4ade80; font-weight: 600; }
      
      .line-1 { animation: fadeIn 0.3s ease forwards; }
      .line-2 { animation: fadeIn 0.3s ease 1.0s forwards; opacity: 0; }
      .line-3 { animation: fadeIn 0.3s ease 2.0s forwards; opacity: 0; }
      .line-4 { animation: fadeIn 0.3s ease 3.0s forwards; opacity: 0; }
      .line-5 { animation: fadeIn 0.3s ease 4.0s forwards; opacity: 0; }
      .line-6 { animation: pulseGrace 2s infinite ease-in-out 4.8s, fadeIn 0.3s ease 4.8s forwards; opacity: 0; }
      .cursor { fill: #58a6ff; animation: blink 0.9s infinite; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseGrace {
        0%, 100% { fill: #f59e0b; }
        50% { fill: #fef08a; }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="778" height="268" rx="8" class="bg" />

  <!-- Top Header Bar -->
  <path d="M 1 9 Q 1 1 9 1 L 771 1 Q 779 1 779 9 L 779 32 L 1 32 Z" class="topbar" />
  
  <!-- Window Controls (Red, Yellow, Green) -->
  <circle cx="20" cy="16" r="5.5" fill="#ff5f56" />
  <circle cx="36" cy="16" r="5.5" fill="#ffbd2e" />
  <circle cx="52" cy="16" r="5.5" fill="#27c93f" />

  <!-- Title -->
  <text x="390" y="20" class="title">genji@archlinux: ~/42-Cursus</text>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Command 1 -->
  <g class="line-1 text">
    <text x="24" y="60" class="prompt">genji@archlinux</text>
    <text x="145" y="60" fill="#768390">:</text>
    <text x="155" y="60" class="host">~/push_swap</text>
    <text x="240" y="60" fill="#768390">$</text>
    <text x="255" y="60" class="cmd">make re</text>
  </g>

  <!-- Line 2: Compilation Output -->
  <g class="line-2 text">
    <text x="24" y="85" class="output-dim">cc -Wall -Wextra -Werror -c push_swap.c radix_sort.c</text>
    <text x="24" y="105" class="success">✔ Build complete: ./push_swap binary ready</text>
  </g>

  <!-- Line 3: Command 2 -->
  <g class="line-3 text">
    <text x="24" y="135" class="prompt">genji@archlinux</text>
    <text x="145" y="135" fill="#768390">:</text>
    <text x="155" y="135" class="host">~/push_swap</text>
    <text x="240" y="135" fill="#768390">$</text>
    <text x="255" y="135" class="cmd">valgrind --leak-check=full ./push_swap 4 67 3 87 23</text>
  </g>

  <!-- Line 4: Valgrind Output -->
  <g class="line-4 text">
    <text x="24" y="160" class="success">All heap blocks were freed -- 0 errors, 0 leaks possible</text>
  </g>

  <!-- Line 5: Command 3 -->
  <g class="line-5 text">
    <text x="24" y="195" class="prompt">genji@archlinux</text>
    <text x="145" y="195" fill="#768390">:</text>
    <text x="155" y="195" class="host">~/42-Cursus</text>
    <text x="240" y="195" fill="#768390">$</text>
    <text x="255" y="195" class="cmd">fastfetch --profile</text>
  </g>

  <!-- Line 6: Souls / 42 Status -->
  <g class="line-6 text">
    <text x="24" y="230" font-weight="bold">✦ RESTED AT SITE OF GRACE — COMMON CORE CIRCLE 01 CONQUERED ✦</text>
    <rect x="580" y="217" width="8" height="15" class="cursor" />
  </g>
</svg>
