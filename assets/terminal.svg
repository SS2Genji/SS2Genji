<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 310" width="100%" height="310">
  <defs>
    <style><![CDATA[
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
      .topbar { fill: #161b22; stroke: #30363d; stroke-width: 1px; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; text-anchor: middle; font-weight: 500; }
      .mono { font-family: "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 13.5px; }
      
      .prompt-user { fill: #38bdf8; font-weight: 700; }
      .prompt-path { fill: #c084fc; font-weight: 600; }
      .cmd-text { fill: #f8fafc; font-weight: 600; }
      
      .arch-logo { fill: #1793d1; font-weight: bold; }
      .label { fill: #e5a93b; font-weight: 600; }
      .val { fill: #e2e8f0; }
      .status-val { fill: #facc15; font-weight: 600; }

      /* Pure SVG Typewriter: character by character */
      .c1 { opacity: 0; animation: showChar 0.05s forwards 0.4s; }
      .c2 { opacity: 0; animation: showChar 0.05s forwards 0.52s; }
      .c3 { opacity: 0; animation: showChar 0.05s forwards 0.64s; }
      .c4 { opacity: 0; animation: showChar 0.05s forwards 0.76s; }
      .c5 { opacity: 0; animation: showChar 0.05s forwards 0.88s; }
      .c6 { opacity: 0; animation: showChar 0.05s forwards 1.00s; }
      .c7 { opacity: 0; animation: showChar 0.05s forwards 1.12s; }
      .c8 { opacity: 0; animation: showChar 0.05s forwards 1.24s; }
      .c9 { opacity: 0; animation: showChar 0.05s forwards 1.36s; }
      @keyframes showChar { to { opacity: 1; } }

      /* Typewriter cursor moves with characters */
      .type-cursor {
        fill: #38bdf8;
        animation: cursorBlink 0.7s infinite, moveCursor 1.0s steps(9) 0.4s forwards, hideTypeCursor 0.1s forwards 1.6s;
      }
      @keyframes moveCursor {
        from { transform: translateX(0); }
        to { transform: translateX(76px); }
      }
      @keyframes hideTypeCursor {
        to { opacity: 0; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* Output Reveal: appears after command types out */
      .output-group {
        opacity: 0;
        animation: revealOutput 0.5s ease-out 1.7s forwards;
      }
      @keyframes revealOutput {
        to { opacity: 1; }
      }

      /* Final Prompt and Persistent Blinking Cursor */
      .final-prompt {
        opacity: 0;
        animation: revealPrompt 0.4s ease-out 2.2s forwards;
      }
      @keyframes revealPrompt {
        to { opacity: 1; }
      }
      .final-cursor {
        fill: #38bdf8;
        animation: cursorBlink 0.8s infinite;
      }
    ]]></style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="738" height="308" rx="8" class="bg" />

  <!-- Top Header Bar -->
  <path d="M 1 9 Q 1 1 9 1 L 731 1 Q 739 1 739 9 L 739 34 L 1 34 Z" class="topbar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="17" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="17" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="17" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="370" y="21" class="title">genji@archlinux: ~</text>

  <!-- Command Line: genji@archlinux:~$ fastfetch -->
  <g class="mono">
    <text x="24" y="66" class="prompt-user">genji@archlinux</text>
    <text x="150" y="66" fill="#768390">:</text>
    <text x="160" y="66" class="prompt-path">~</text>
    <text x="175" y="66" fill="#768390">$</text>
    
    <!-- Pure SVG Typewritten fastfetch text -->
    <text x="195" y="66" class="cmd-text">
      <tspan class="c1">f</tspan><tspan class="c2">a</tspan><tspan class="c3">s</tspan><tspan class="c4">t</tspan><tspan class="c5">f</tspan><tspan class="c6">e</tspan><tspan class="c7">t</tspan><tspan class="c8">c</tspan><tspan class="c9">h</tspan>
    </text>

    <!-- Typing Cursor (moves as fastfetch types, then disappears) -->
    <rect x="195" y="52" width="8" height="16" class="type-cursor" />
  </g>

  <!-- Output Block (Arch Logo + User Specs) -->
  <g class="output-group mono">
    <!-- Arch Linux Logo (Left) -->
    <g class="arch-logo">
      <text x="35" y="112">        /\</text>
      <text x="35" y="132">       /  \</text>
      <text x="35" y="152">      /\   \</text>
      <text x="35" y="172">     /      \</text>
      <text x="35" y="192">    /   ,,   \</text>
      <text x="35" y="212">   /   |  |  -\</text>
      <text x="35" y="232">  /_-''    ''-_\</text>
    </g>

    <!-- Specs (Right) -->
    <g transform="translate(210, 0)">
      <text x="0" y="112" class="label">User:</text>
      <text x="90" y="112" class="val" font-weight="600">Ahmet Emir Şimşek</text>

      <text x="0" y="136" class="label">Academy:</text>
      <text x="90" y="136" class="val">42 Istanbul</text>

      <text x="0" y="160" class="label">OS:</text>
      <text x="90" y="160" class="val">Arch Linux x86_64</text>

      <text x="0" y="184" class="label">Focus:</text>
      <text x="90" y="184" class="val">C, Algorithms, Python</text>

      <text x="0" y="208" class="label">Editor:</text>
      <text x="90" y="208" class="val">Neovim, VSCode</text>

      <text x="0" y="232" class="label">Status:</text>
      <text x="90" y="232" class="status-val">Resting at Site of Grace</text>
    </g>
  </g>

  <!-- Final Waiting Prompt with Blinking Cursor -->
  <g class="final-prompt mono">
    <text x="24" y="275" class="prompt-user">genji@archlinux</text>
    <text x="150" y="275" fill="#768390">:</text>
    <text x="160" y="275" class="prompt-path">~</text>
    <text x="175" y="275" fill="#768390">$</text>
    <rect x="195" y="261" width="8" height="16" class="final-cursor" />
  </g>
</svg>
