<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 90" width="100%" height="90" shape-rendering="crispEdges">
  <defs>
    <style><![CDATA[
      .pixel-txt {
        font-family: 'Courier New', 'Fira Code', 'JetBrains Mono', monospace;
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 1.5px;
      }

      /* =================== MILESTONE 1 (3 BARS, RIGHT TO LEFT) =================== */
      .m1-layer {
        animation: m1Life 14s infinite;
      }
      @keyframes m1Life {
        0%, 36% { opacity: 1; transform: translateY(0); }
        39% { opacity: 0; transform: translateY(-4px); }
        40%, 98% { opacity: 0; }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* Screen shake on hits */
      .m1-shake {
        animation: m1ShakeAnim 14s infinite;
      }
      @keyframes m1ShakeAnim {
        0%, 5.5% { transform: translate(0, 0); }
        5.6% { transform: translate(-2px, 2px); }
        6.4% { transform: translate(2px, -2px); }
        7.2% { transform: translate(0, 0); }

        12.7% { transform: translate(0, 0); }
        12.8% { transform: translate(-2px, 2px); }
        13.6% { transform: translate(2px, -2px); }
        14.4% { transform: translate(0, 0); }

        19.9% { transform: translate(0, 0); }
        20.0% { transform: translate(-3px, 3px); }
        20.8% { transform: translate(3px, -3px); }
        21.6% { transform: translate(0, 0); }
        100% { transform: translate(0, 0); }
      }

      /* Hit 1: Rightmost Bar (Bar 3) dies first */
      .m1-bar-3 {
        animation: m1Drain3 14s infinite;
      }
      @keyframes m1Drain3 {
        0%, 5.6% { width: 154px; fill: #dc2626; }
        5.8% { fill: #fef08a; }
        7.0%, 39% { width: 0px; fill: #dc2626; }
        40%, 98% { width: 154px; }
        100% { width: 154px; }
      }

      /* Hit 2: Middle Bar (Bar 2) dies second */
      .m1-bar-2 {
        animation: m1Drain2 14s infinite;
      }
      @keyframes m1Drain2 {
        0%, 12.7% { width: 154px; fill: #dc2626; }
        12.9% { fill: #fef08a; }
        14.1%, 39% { width: 0px; fill: #dc2626; }
        40%, 98% { width: 154px; }
        100% { width: 154px; }
      }

      /* Hit 3: Leftmost Bar (Bar 1) dies last */
      .m1-bar-1 {
        animation: m1Drain1 14s infinite;
      }
      @keyframes m1Drain1 {
        0%, 19.9% { width: 154px; fill: #dc2626; }
        20.1% { fill: #fef08a; }
        21.3%, 39% { width: 0px; fill: #dc2626; }
        40%, 98% { width: 154px; }
        100% { width: 154px; }
      }

      /* Golden Pixel Sparks */
      .sparks-3 {
        opacity: 0;
        animation: sparks3Anim 14s infinite;
      }
      @keyframes sparks3Anim {
        5.6% { opacity: 0; transform: scale(0.6); }
        5.8% { opacity: 1; transform: scale(1.2); }
        6.8% { opacity: 0; transform: scale(1.6); }
      }

      .sparks-2 {
        opacity: 0;
        animation: sparks2Anim 14s infinite;
      }
      @keyframes sparks2Anim {
        12.8% { opacity: 0; transform: scale(0.6); }
        13.0% { opacity: 1; transform: scale(1.2); }
        14.0% { opacity: 0; transform: scale(1.6); }
      }

      .sparks-1 {
        opacity: 0;
        animation: sparks1Anim 14s infinite;
      }
      @keyframes sparks1Anim {
        20.0% { opacity: 0; transform: scale(0.6); }
        20.2% { opacity: 1; transform: scale(1.2); }
        21.2% { opacity: 0; transform: scale(1.6); }
      }

      /* M1 Top-Right Status: [BOSS] while alive, [FELLED] after death */
      .m1-tag-live {
        animation: m1TagLiveAnim 14s infinite;
      }
      @keyframes m1TagLiveAnim {
        0%, 20.8% { opacity: 1; }
        21.2%, 100% { opacity: 0; }
      }

      .m1-tag-felled {
        opacity: 0;
        animation: m1TagFelledAnim 14s infinite;
      }
      @keyframes m1TagFelledAnim {
        0%, 20.8% { opacity: 0; }
        21.2%, 37% { opacity: 1; }
        39%, 100% { opacity: 0; }
      }

      /* M1 Big Felled Banner Text */
      .m1-felled {
        opacity: 0;
        animation: m1FelledAnim 14s infinite;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        font-weight: 900;
        fill: #f59e0b;
        letter-spacing: 4px;
      }
      @keyframes m1FelledAnim {
        0%, 21.5% { opacity: 0; }
        22.5%, 36% { opacity: 1; }
        38%, 100% { opacity: 0; }
      }

      /* =================== MILESTONE 2 (5 BARS, NO BOTTOM YELLOW BAR) =================== */
      .m2-layer {
        opacity: 0;
        animation: m2Life 14s infinite;
      }
      @keyframes m2Life {
        0%, 39% { opacity: 0; transform: translateY(4px); }
        42%, 94% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; }
      }

      /* M2 Bars 1 to 4 on left STAY ALIVE */
      .m2-bar-left {
        animation: m2BarLeftAnim 14s infinite;
      }
      @keyframes m2BarLeftAnim {
        0%, 41% { width: 0px; }
        46%, 95% { width: 91px; }
        98%, 100% { width: 0px; }
      }

      /* M2 Bar 5 (Rightmost) struck to 0 */
      .m2-bar-5 {
        animation: m2Bar5Drain 14s infinite;
      }
      @keyframes m2Bar5Drain {
        0%, 41% { width: 0px; fill: #dc2626; }
        46%, 53.4% { width: 91px; fill: #dc2626; }
        53.6% { fill: #fef08a; }
        55.0%, 95% { width: 0px; fill: #dc2626; }
        98%, 100% { width: 0px; }
      }

      /* M2 Sparks on Bar 5 */
      .m2-sparks-5 {
        opacity: 0;
        animation: m2SparksAnim 14s infinite;
      }
      @keyframes m2SparksAnim {
        53.4% { opacity: 0; transform: scale(0.6); }
        53.6% { opacity: 1; transform: scale(1.2); }
        54.6% { opacity: 0; transform: scale(1.6); }
      }

      /* M2 Shake */
      .m2-shake {
        animation: m2ShakeAnim 14s infinite;
      }
      @keyframes m2ShakeAnim {
        0%, 53.3% { transform: translate(0, 0); }
        53.4% { transform: translate(-2px, 2px); }
        54.2% { transform: translate(2px, -2px); }
        55.0% { transform: translate(0, 0); }
        100% { transform: translate(0, 0); }
      }

      /* M2 Damage pop-up */
      .m2-dmg-pop {
        opacity: 0;
        animation: m2DmgAnim 14s infinite;
        font-family: 'Courier New', monospace;
        font-size: 11px;
        font-weight: 900;
        fill: #facc15;
      }
      @keyframes m2DmgAnim {
        0%, 53.4% { opacity: 0; transform: translateY(0); }
        54.0% { opacity: 1; transform: translateY(-3px); }
        64.0% { opacity: 1; transform: translateY(-13px); }
        72.0%, 100% { opacity: 0; transform: translateY(-18px); }
      }

      .pulse-red {
        animation: pulseRed 2s infinite alternate;
      }
      @keyframes pulseRed {
        0% { fill: #dc2626; }
        100% { fill: #ef4444; }
      }
    ]]></style>
  </defs>

  <!-- ================= 1. SAHNE: MILESTONE 1 ================= -->
  <g class="m1-layer">
    <g class="m1-shake">
      <!-- M1 Header -->
      <g transform="translate(110, 22)">
        <rect x="0" y="2" width="12" height="10" fill="#991b1b" />
        <rect x="2" y="0" width="8" height="14" fill="#991b1b" />
        <rect x="3" y="4" width="2" height="3" fill="#0d1117" />
        <rect x="7" y="4" width="2" height="3" fill="#0d1117" />
        <rect x="5" y="9" width="2" height="2" fill="#0d1117" />

        <text x="22" y="11" fill="#f8fafc" class="pixel-txt">MILESTONE 1</text>
        
        <!-- Live Tag: [BOSS] while fighting -->
        <text x="400" y="11" fill="#ef4444" class="pixel-txt m1-tag-live">[BOSS]</text>
        <!-- Dead Tag: [FELLED] only after 3rd hit -->
        <text x="390" y="11" fill="#f59e0b" class="pixel-txt m1-tag-felled">[FELLED]</text>
      </g>

      <!-- 3 Segments: Bar 1 (Left), Bar 2 (Mid), Bar 3 (Right) -->
      <g transform="translate(110, 36)">
        <!-- Bar 1 (Left) -> Dies 3rd -->
        <g transform="translate(0, 0)">
          <rect x="-2" y="-2" width="158" height="20" fill="#78350f" />
          <rect x="-1" y="-1" width="156" height="18" fill="#d97706" />
          <rect x="0" y="0" width="154" height="16" fill="#200606" />
          <rect x="0" y="0" width="154" height="16" class="m1-bar-1" />
          <g class="sparks-1" transform="translate(77, 8)">
            <rect x="-6" y="-6" width="3" height="3" fill="#fef08a" />
            <rect x="6" y="-4" width="3" height="3" fill="#f59e0b" />
            <rect x="-4" y="5" width="3" height="3" fill="#f59e0b" />
            <rect x="5" y="6" width="3" height="3" fill="#fef08a" />
          </g>
        </g>

        <!-- Bar 2 (Middle) -> Dies 2nd -->
        <g transform="translate(163, 0)">
          <rect x="-2" y="-2" width="158" height="20" fill="#78350f" />
          <rect x="-1" y="-1" width="156" height="18" fill="#d97706" />
          <rect x="0" y="0" width="154" height="16" fill="#200606" />
          <rect x="0" y="0" width="154" height="16" class="m1-bar-2" />
          <g class="sparks-2" transform="translate(77, 8)">
            <rect x="-6" y="-6" width="3" height="3" fill="#fef08a" />
            <rect x="6" y="-4" width="3" height="3" fill="#f59e0b" />
            <rect x="-4" y="5" width="3" height="3" fill="#f59e0b" />
            <rect x="5" y="6" width="3" height="3" fill="#fef08a" />
          </g>
        </g>

        <!-- Bar 3 (Right) -> Dies 1st -->
        <g transform="translate(326, 0)">
          <rect x="-2" y="-2" width="158" height="20" fill="#78350f" />
          <rect x="-1" y="-1" width="156" height="18" fill="#d97706" />
          <rect x="0" y="0" width="154" height="16" fill="#200606" />
          <rect x="0" y="0" width="154" height="16" class="m1-bar-3" />
          <g class="sparks-3" transform="translate(77, 8)">
            <rect x="-6" y="-6" width="3" height="3" fill="#fef08a" />
            <rect x="6" y="-4" width="3" height="3" fill="#f59e0b" />
            <rect x="-4" y="5" width="3" height="3" fill="#f59e0b" />
            <rect x="5" y="6" width="3" height="3" fill="#fef08a" />
          </g>
        </g>
      </g>

      <!-- Felled Text Overlay -->
      <text x="250" y="49" class="m1-felled">GREAT ENEMY FELLED</text>
    </g>
  </g>

  <!-- ================= 2. SAHNE: MILESTONE 2 (5 BAR, NO YELLOW POISE BAR) ================= -->
  <g class="m2-layer">
    <g class="m2-shake">
      <!-- M2 Header -->
      <g transform="translate(110, 22)">
        <rect x="0" y="0" width="4" height="14" fill="#38bdf8" />
        <rect x="10" y="0" width="4" height="14" fill="#38bdf8" />
        <rect x="-2" y="3" width="8" height="3" fill="#cbd5e1" />
        <rect x="8" y="3" width="8" height="3" fill="#cbd5e1" />

        <text x="24" y="11" fill="#f8fafc" class="pixel-txt">MILESTONE 2</text>
        <text x="350" y="11" fill="#38bdf8" class="pixel-txt">[CURRENT FOE]</text>
      </g>

      <!-- 5 Segments: Bars 1 to 4 on left STAY ALIVE, Bar 5 on RIGHT dies (No bottom yellow bar!) -->
      <g transform="translate(110, 36)">
        <!-- Bar 1 (Left) -> Alive -->
        <g transform="translate(0, 0)">
          <rect x="-2" y="-2" width="95" height="20" fill="#78350f" />
          <rect x="-1" y="-1" width="93" height="18" fill="#d97706" />
          <rect x="0" y="0" width="91" height="16" fill="#360a0a" />
          <rect x="0" y="0" width="91" height="16" class="m2-bar-left pulse-red" />
        </g>

        <!-- Bar 2 -> Alive -->
        <g transform="translate(97, 0)">
          <rect x="-2" y="-2" width="95" height="20" fill="#78350f" />
          <rect x="-1" y="-1" width="93" height="18" fill="#d97706" />
          <rect x="0" y="0" width="91" height="16" fill="#360a0a" />
          <rect x="0" y="0" width="91" height="16" class="m2-bar-left pulse-red" />
        </g>

        <!-- Bar 3 -> Alive -->
        <g transform="translate(194, 0)">
          <rect x="-2" y="-2" width="95" height="20" fill="#78350f" />
          <rect x="-1" y="-1" width="93" height="18" fill="#d97706" />
          <rect x="0" y="0" width="91" height="16" fill="#360a0a" />
          <rect x="0" y="0" width="91" height="16" class="m2-bar-left pulse-red" />
        </g>

        <!-- Bar 4 -> Alive -->
        <g transform="translate(291, 0)">
          <rect x="-2" y="-2" width="95" height="20" fill="#78350f" />
          <rect x="-1" y="-1" width="93" height="18" fill="#d97706" />
          <rect x="0" y="0" width="91" height="16" fill="#360a0a" />
          <rect x="0" y="0" width="91" height="16" class="m2-bar-left pulse-red" />
        </g>

        <!-- Bar 5 (Rightmost) -> Dies -->
        <g transform="translate(388, 0)">
          <rect x="-2" y="-2" width="95" height="20" fill="#78350f" />
          <rect x="-1" y="-1" width="93" height="18" fill="#d97706" />
          <rect x="0" y="0" width="91" height="16" fill="#360a0a" />
          <rect x="0" y="0" width="91" height="16" class="m2-bar-5" />
          <!-- Pixel Sparks on Bar 5 -->
          <g class="m2-sparks-5" transform="translate(45, 8)">
            <rect x="-6" y="-6" width="3" height="3" fill="#fef08a" />
            <rect x="6" y="-4" width="3" height="3" fill="#f59e0b" />
            <rect x="-4" y="5" width="3" height="3" fill="#f59e0b" />
            <rect x="5" y="6" width="3" height="3" fill="#fef08a" />
          </g>
        </g>
      </g>

      <!-- Damage Pop-up: -1 BAR over Bar 5 -->
      <text x="495" y="30" class="m2-dmg-pop">-1 BAR</text>
    </g>
  </g>
</svg>
