<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 95" width="100%" height="95" shape-rendering="crispEdges">
  <defs>
    <style><![CDATA[
      .pixel-txt {
        font-family: 'Courier New', 'Fira Code', 'JetBrains Mono', monospace;
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 1.5px;
      }

      /* ================= MILESTONE 1 ANIMATIONS ================= */
      .m1-box {
        animation: m1Life 12s infinite;
      }
      @keyframes m1Life {
        0%, 25% { opacity: 1; transform: translateY(0); }
        30% { opacity: 0; transform: translateY(-4px); }
        31%, 97% { opacity: 0; }
        99%, 100% { opacity: 1; transform: translateY(0); }
      }

      /* M1 Final Hit Shake */
      .m1-shake {
        animation: m1Shake 12s infinite;
      }
      @keyframes m1Shake {
        0%, 11% { transform: translate(0, 0); }
        12% { transform: translate(-3px, 2px); }
        13% { transform: translate(3px, -2px); }
        14% { transform: translate(-2px, 1px); }
        15%, 100% { transform: translate(0, 0); }
      }

      /* M1 HP Bar: Starts at 160px, drops to 0 on hit */
      .m1-hp {
        animation: m1Drain 12s infinite;
      }
      @keyframes m1Drain {
        0%, 11% { width: 160px; }
        14%, 30% { width: 0px; }
        31%, 97% { width: 160px; }
        100% { width: 160px; }
      }

      /* M1 Felled Text */
      .felled-text {
        opacity: 0;
        animation: m1Felled 12s infinite;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        font-weight: 900;
        fill: #f59e0b;
        letter-spacing: 3px;
      }
      @keyframes m1Felled {
        0%, 13% { opacity: 0; }
        15%, 26% { opacity: 1; }
        29%, 100% { opacity: 0; }
      }

      /* ================= MILESTONE 2 ANIMATIONS ================= */
      .m2-box {
        opacity: 0;
        animation: m2Life 12s infinite;
      }
      @keyframes m2Life {
        0%, 30% { opacity: 0; transform: translateY(4px); }
        34%, 93% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; }
      }

      /* M2 HP Fill then Hit */
      .m2-hp-fill {
        animation: m2HpAction 12s infinite;
      }
      @keyframes m2HpAction {
        0%, 32% { width: 0px; }
        40%, 54% { width: 500px; } /* fills to 100% */
        56%, 93% { width: 380px; } /* struck once, stays at ~76%! */
        97%, 100% { width: 0px; }
      }

      /* M2 Yellow damage buffer */
      .m2-yellow-hp {
        animation: m2YellowAction 12s infinite;
      }
      @keyframes m2YellowAction {
        0%, 32% { width: 0px; }
        40%, 56% { width: 500px; }
        66%, 93% { width: 380px; } /* drains to 76% and stays! */
        97%, 100% { width: 0px; }
      }

      /* M2 Slash Effect */
      .m2-slash {
        opacity: 0;
        animation: m2Slash 12s infinite;
      }
      @keyframes m2Slash {
        0%, 53% { opacity: 0; }
        54% { opacity: 1; }
        56% { opacity: 0; }
        100% { opacity: 0; }
      }

      /* M2 Hit Shake */
      .m2-shake {
        animation: m2Shake 12s infinite;
      }
      @keyframes m2Shake {
        0%, 53% { transform: translate(0, 0); }
        54% { transform: translate(-3px, 2px); }
        55% { transform: translate(3px, -2px); }
        56% { transform: translate(-2px, 1px); }
        57%, 100% { transform: translate(0, 0); }
      }

      /* M2 Damage pop-up */
      .m2-dmg {
        opacity: 0;
        animation: m2Dmg 12s infinite;
        font-family: 'Courier New', monospace;
        font-size: 11px;
        font-weight: 900;
        fill: #facc15;
      }
      @keyframes m2Dmg {
        0%, 54% { opacity: 0; transform: translateY(0); }
        56% { opacity: 1; transform: translateY(-3px); }
        68% { opacity: 1; transform: translateY(-14px); }
        76%, 100% { opacity: 0; transform: translateY(-20px); }
      }

      /* Pulse on living M2 bar */
      .pulse-bar {
        animation: pulseBar 2s infinite alternate;
      }
      @keyframes pulseBar {
        0% { fill: #dc2626; }
        100% { fill: #ef4444; }
      }
    ]]></style>
  </defs>

  <!-- ================= 1. SAHNE: MILESTONE 1 (ÖLDÜRÜLÜŞ) ================= -->
  <g class="m1-box">
    <g class="m1-shake">
      <!-- M1 Header -->
      <g transform="translate(100, 22)">
        <rect x="0" y="2" width="12" height="10" fill="#991b1b" />
        <rect x="2" y="0" width="8" height="14" fill="#991b1b" />
        <rect x="3" y="4" width="2" height="3" fill="#0d1117" />
        <rect x="7" y="4" width="2" height="3" fill="#0d1117" />
        <rect x="5" y="9" width="2" height="2" fill="#0d1117" />

        <text x="22" y="11" fill="#f8fafc" class="pixel-txt">MILESTONE 1: CIRCLE 01</text>
        <text x="380" y="11" fill="#f59e0b" class="pixel-txt">[FELLED]</text>
      </g>

      <!-- M1 Health Bar Frame -->
      <g transform="translate(100, 36)">
        <rect x="-3" y="-3" width="506" height="22" fill="#78350f" />
        <rect x="-2" y="-2" width="504" height="20" fill="#d97706" />
        <rect x="-1" y="-1" width="502" height="18" fill="#1e1b18" />

        <!-- Empty Bar Background -->
        <rect x="0" y="0" width="500" height="16" fill="#200606" />

        <!-- Dying Red Bar -->
        <rect x="0" y="0" width="160" height="16" fill="#dc2626" class="m1-hp" />

        <!-- Final Slash -->
        <polygon points="120,-8 160,24 145,24 105,-8" fill="#ffffff" class="m2-slash" style="animation-name: m1Shake;" />
      </g>

      <!-- Felled Text Banner in Middle -->
      <text x="260" y="48" class="felled-text">GREAT ENEMY FELLED</text>
    </g>
  </g>

  <!-- ================= 2. SAHNE: MILESTONE 2 (ÇIKIŞ + 1 VURUŞ + DURMA) ================= -->
  <g class="m2-box">
    <g class="m2-shake">
      <!-- M2 Header -->
      <g transform="translate(100, 22)">
        <!-- Pixel Swords Emblem -->
        <rect x="0" y="0" width="4" height="14" fill="#38bdf8" />
        <rect x="10" y="0" width="4" height="14" fill="#38bdf8" />
        <rect x="-2" y="3" width="8" height="3" fill="#cbd5e1" />
        <rect x="8" y="3" width="8" height="3" fill="#cbd5e1" />

        <text x="24" y="11" fill="#f8fafc" class="pixel-txt">MILESTONE 2: CIRCLE 02</text>
        <text x="350" y="11" fill="#38bdf8" class="pixel-txt">[CURRENT FOE]</text>
      </g>

      <!-- M2 Health Bar Frame -->
      <g transform="translate(100, 36)">
        <rect x="-3" y="-3" width="506" height="22" fill="#78350f" />
        <rect x="-2" y="-2" width="504" height="20" fill="#d97706" />
        <rect x="-1" y="-1" width="502" height="18" fill="#1e1b18" />

        <!-- Empty Bar Background -->
        <rect x="0" y="0" width="500" height="16" fill="#360a0a" />

        <!-- Yellow Damage Buffer Bar -->
        <rect x="0" y="0" width="500" height="16" fill="#ca8a04" class="m2-yellow-hp" />

        <!-- Red Active Bar (fills to 100%, struck once to 76%, stays!) -->
        <rect x="0" y="0" width="500" height="16" class="m2-hp-fill pulse-bar" />

        <!-- Slash FX on Hit -->
        <polygon points="340,-8 380,24 365,24 325,-8" fill="#ffffff" class="m2-slash" />

        <!-- Inner Pixel Dividers -->
        <line x1="125" y1="0" x2="125" y2="16" stroke="#1e1b18" stroke-width="2" />
        <line x1="250" y1="0" x2="250" y2="16" stroke="#1e1b18" stroke-width="2" />
        <line x1="375" y1="0" x2="375" y2="16" stroke="#1e1b18" stroke-width="2" />

        <!-- Stagger / Poise Bar -->
        <rect x="0" y="18" width="500" height="4" fill="#1c1917" />
        <rect x="0" y="19" width="380" height="2" fill="#facc15" />
      </g>

      <!-- Damage Pop-up: -42 HP -->
      <text x="440" y="30" class="m2-dmg">-42 HP</text>
    </g>
  </g>
</svg>
