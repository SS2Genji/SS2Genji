<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 90" width="100%" height="90" shape-rendering="crispEdges">
  <defs>
    <style><![CDATA[
      .pixel-txt {
        font-family: 'Courier New', 'Fira Code', 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.5px;
      }

      /* Screen shake on hit */
      .shake-box {
        animation: hitShake 7s infinite;
      }
      @keyframes hitShake {
        0%, 22% { transform: translate(0, 0); }
        23% { transform: translate(-3px, 2px); }
        24% { transform: translate(3px, -2px); }
        25% { transform: translate(-2px, 1px); }
        26% { transform: translate(2px, -1px); }
        27%, 100% { transform: translate(0, 0); }
      }

      /* Red Health Bar: Drains instantly on hit */
      .red-hp {
        animation: drainRed 7s infinite;
      }
      @keyframes drainRed {
        0%, 22% { width: 500px; }
        24%, 90% { width: 280px; }
        98%, 100% { width: 500px; }
      }

      /* Yellow Residual Bar: Drains slowly after hit */
      .yellow-hp {
        animation: drainYellow 7s infinite;
      }
      @keyframes drainYellow {
        0%, 25% { width: 500px; }
        38%, 90% { width: 280px; }
        98%, 100% { width: 500px; }
      }

      /* White Slash Effect */
      .slash {
        opacity: 0;
        animation: flashSlash 7s infinite;
      }
      @keyframes flashSlash {
        0%, 22% { opacity: 0; }
        23% { opacity: 1; }
        25% { opacity: 0; }
        100% { opacity: 0; }
      }

      /* Floating Damage Pop-up */
      .dmg-text {
        opacity: 0;
        animation: floatDamage 7s infinite;
        font-family: 'Courier New', monospace;
        font-size: 11px;
        font-weight: 900;
        fill: #facc15;
      }
      @keyframes floatDamage {
        0%, 22% { opacity: 0; transform: translateY(0); }
        24% { opacity: 1; transform: translateY(-3px); }
        35% { opacity: 1; transform: translateY(-14px); }
        44%, 100% { opacity: 0; transform: translateY(-20px); }
      }

      /* Stagger Bar pulse */
      .stagger-bar {
        animation: pulseStagger 2s infinite alternate;
      }
      @keyframes pulseStagger {
        0% { fill: #d97706; }
        100% { fill: #facc15; }
      }
    ]]></style>
  </defs>

  <g class="shake-box">
    <!-- Boss Header: Pixel Icon and Title -->
    <g transform="translate(100, 22)">
      <!-- Pixel Skull / Boss Emblem -->
      <rect x="0" y="2" width="12" height="10" fill="#dc2626" />
      <rect x="2" y="0" width="8" height="14" fill="#dc2626" />
      <rect x="3" y="4" width="2" height="3" fill="#0d1117" />
      <rect x="7" y="4" width="2" height="3" fill="#0d1117" />
      <rect x="5" y="9" width="2" height="2" fill="#0d1117" />

      <!-- Boss Name -->
      <text x="22" y="11" fill="#f8fafc" class="pixel-txt">COMMON CORE, THE UNYIELDING</text>
      
      <!-- Phase Tag -->
      <text x="420" y="11" fill="#ef4444" class="pixel-txt">[PHASE 1]</text>
    </g>

    <!-- Main Health Bar Outer Frame (Stepped Pixel Border) -->
    <g transform="translate(100, 36)">
      <!-- Stepped Gold/Bronze Pixel Border -->
      <rect x="-3" y="-3" width="506" height="22" fill="#78350f" />
      <rect x="-2" y="-2" width="504" height="20" fill="#d97706" />
      <rect x="-1" y="-1" width="502" height="18" fill="#1e1b18" />

      <!-- Bar Background (Depleted HP) -->
      <rect x="0" y="0" width="500" height="16" fill="#360a0a" />

      <!-- Yellow Damage Buffer Bar -->
      <rect x="0" y="0" width="500" height="16" fill="#ca8a04" class="yellow-hp" />

      <!-- Active Red Health Bar -->
      <rect x="0" y="0" width="500" height="16" fill="#dc2626" class="red-hp" />

      <!-- Health Bar Highlights & Pixel Segments -->
      <rect x="0" y="0" width="500" height="3" fill="#f87171" opacity="0.6" />
      <rect x="0" y="13" width="500" height="3" fill="#7f1d1d" opacity="0.8" />

      <!-- Inner Pixel Dividers -->
      <line x1="125" y1="0" x2="125" y2="16" stroke="#1e1b18" stroke-width="2" />
      <line x1="250" y1="0" x2="250" y2="16" stroke="#1e1b18" stroke-width="2" />
      <line x1="375" y1="0" x2="375" y2="16" stroke="#1e1b18" stroke-width="2" />

      <!-- Slash FX on Hit -->
      <polygon points="260,-8 300,24 285,24 245,-8" fill="#ffffff" class="slash" />

      <!-- Stagger / Poise Bar (Underneath) -->
      <rect x="0" y="18" width="500" height="4" fill="#1c1917" />
      <rect x="0" y="19" width="340" height="2" class="stagger-bar" />
    </g>

    <!-- Floating Damage Number Pop-up -->
    <text x="355" y="30" class="dmg-text">-42 HP [CRIT]</text>
  </g>
</svg>
